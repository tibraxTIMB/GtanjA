<!doctype html><html lang="nn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>GTanjA 6 – First Haul</title><style>*{box-sizing:border-box}body{margin:0;background:#172820;color:white;font:16px system-ui;touch-action:none}header{padding:8px;display:flex;justify-content:space-between;gap:8px}canvas{display:block;width:100%;height:calc(100dvh - 155px);object-fit:contain;background:#263d32}footer{display:flex;justify-content:space-between;padding:8px;gap:8px}button{background:#36594a;color:white;border:1px solid #a9b9a9;border-radius:12px;padding:16px;font:bold 17px system-ui;touch-action:none}#dialog{position:fixed;inset:20% 10%;background:#172820f5;border:2px solid #e9aa79;border-radius:16px;padding:20px;overflow:auto}#dialog button{margin:4px}#dialog[hidden]{display:none}</style><header><b>GTanjA 6 ♥</b><span id="clock"></span><span id="status"></span></header><canvas id="map" width="900" height="600"></canvas><footer><div><button data-key="left">◀</button> <button data-key="right">▶</button></div><button id="reset">Ny tur</button><div><button data-key="reverse">Rygg</button> <button data-key="forward">Gass</button></div></footer><section id="dialog" hidden></section><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),keys={},dialog=document.querySelector('#dialog'),status=document.querySelector('#status'),clock=document.querySelector('#clock');
let x,y,a,b,v,stage,time,active,prev,score;
function reset(){x=100;y=300;a=0;b=0;v=0;stage=0;time=180;active=true;score=0;dialog.hidden=true;Object.keys(keys).forEach(k=>keys[k]=false)}
reset();document.querySelector('#reset').onclick=reset;
for(const el of document.querySelectorAll('[data-key]')){const k=el.dataset.key;el.onpointerdown=e=>{el.setPointerCapture(e.pointerId);keys[k]=true};el.onpointerup=el.onpointercancel=el.onlostpointercapture=()=>keys[k]=false}
const km={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'forward',ArrowDown:'reverse',a:'left',d:'right',w:'forward',s:'reverse'};onkeydown=e=>{if(km[e.key]){e.preventDefault();keys[km[e.key]]=true}};onkeyup=e=>{if(km[e.key])keys[km[e.key]]=false};onblur=()=>Object.keys(keys).forEach(k=>keys[k]=false);
function modal(title,options){active=false;v=0;Object.keys(keys).forEach(k=>keys[k]=false);dialog.replaceChildren();const h=document.createElement('h2');h.textContent=title;dialog.append(h);for(const [label,fn] of options){const btn=document.createElement('button');btn.textContent=label;btn.onclick=()=>{dialog.hidden=true;active=true;fn()};dialog.append(btn)}dialog.hidden=false}
function sort(){modal('BIR-Berit: Kvar skal greinene?', [['Hageavfall',()=>{score+=100;stage=2;modal('Tanja: Så flinke me var! '+score+' XP',[['Ny tur',reset]])}],['Metall',()=>{time-=15;sort()}],['EE-avfall',()=>{time-=15;sort()}]])}
function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}
function label(t,x,y){g.fillStyle='#fff';g.font='bold 18px system-ui';g.fillText(t,x,y)}
function draw(){rect(0,0,900,600,'#638557');rect(805,0,95,600,'#548ba5');rect(40,250,765,100,'#555d60');rect(570,100,100,450,'#555d60');rect(40,100,100,450,'#555d60');rect(40,100,630,80,'#555d60');rect(40,470,630,80,'#555d60');for(let i=0;i<5;i++){rect(185+i*72,195,48,40,'#d3c1a1');rect(180+i*72,185,58,18,'#8b4e42');rect(185+i*72,375,48,45,'#c6c0ab');rect(180+i*72,365,58,18,'#755b4b')}rect(680,390,115,150,'#a6aaa3');for(let i=0;i<3;i++)rect(690+i*32,405,26,42,['#487a42','#b9a34e','#557a9c'][i]);label('BIR',700,475);label('Kvist-Kari',280,115);label('HEIM',45,240);const tx=stage===0?330:735,ty=stage===0?140:490;g.beginPath();g.arc(tx,ty,20,0,Math.PI*2);g.fillStyle='#f4ca55';g.fill();g.fillStyle='#222';g.font='bold 24px system-ui';g.fillText('!',tx-4,ty+8);
const hx=x-23*Math.cos(a),hy=y-23*Math.sin(a);g.save();g.translate(hx,hy);g.rotate(b);rect(-14,-2,14,4,'#ddd');rect(-62,-18,48,36,'#bfc7c8');rect(-58,-14,40,28,stage===1?'#617c35':'#777f80');rect(-43,-22,12,5,'#222');rect(-43,17,12,5,'#222');g.fillStyle='#f58ba5';g.font='20px system-ui';g.fillText('♥',-49,7);g.restore();g.save();g.translate(x,y);g.rotate(a);rect(-23,-13,46,26,'#bd5946');rect(4,-10,10,20,'#bad3d9');rect(-14,-10,8,20,'#35494e');g.restore();}
function frame(now){const dt=Math.min(.04,(now-(prev||now))/1000);prev=now;if(active){time-=dt;if(time<=0){time=0;modal('BIR har stengt! Tanja prøver igjen.',[['Ny tur',reset]])}else{const target=keys.forward?125:keys.reverse?-65:0;v+=(target-v)*Math.min(1,dt*5);const turn=(keys.right?1:0)-(keys.left?1:0);a+=turn*v/65*dt;b+=v/55*Math.sin(a-b)*dt;x=Math.max(80,Math.min(775,x+Math.cos(a)*v*dt));y=Math.max(65,Math.min(550,y+Math.sin(a)*v*dt));if(stage===0&&Math.hypot(x-330,y-140)<35){modal('Kvist-Kari: Når du først er her …',[['Ta med greinene!',()=>{stage=1;time-=5}],['Slå av ein prat',()=>{stage=1;time-=25}]])}if(stage===1&&Math.hypot(x-735,y-490)<35)sort()}}draw();clock.textContent='BIR '+Math.ceil(time/60-1/60)+':'+String(Math.ceil(time)%60).padStart(2,'0');status.textContent=stage===0?'Hent greiner':stage===1?'Køyr til BIR':'Fullført';requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
