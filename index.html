function poly(points,color){g.fillStyle=color;g.beginPath();points.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fill()} function building(x,y,w,h,roof){rect(x+12,y+10,w,h,'#40583e');poly([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],'#c9b99c');poly([[x+w,y],[x+w+9,y-14],[x+w+9,y+h-14],[x+w,y+h]],'#8d806b');poly([[x,y],[x+9,y-14],[x+w+9,y-14],[x+w,y]],'#e0d2b6');poly([[x-4,y],[x+w/2,y-24],[x+w+13,y-14],[x+w,y+6]],roof);rect(x+8,y+14,10,12,'#6c8e9a');rect(x+30,y+14,10,12,'#6c8e9a')} function draw(){g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,900,600);g.save();if(follow){const z=1.65;g.scale(z,z);g.translate(-Math.max(0,Math.min(900-900/z,x-450/z)),-Math.max(0,Math.min(600-600/z,y-300/z)))}rect(0,0,900,600,'#638557');rect(805,0,95,600,'#548ba5');rect(40,250,765,100,'#555d60');rect(570,100,100,450,'#555d60');rect(40,100,100,450,'#555d60');rect(40,100,630,80,'#555d60');rect(40,470,630,80,'#555d60');for(let i=0;i<5;i++){building(185+i*72,195,48,40,'#8b4e42');building(185+i*72,375,48,45,'#755b4b')}g.save();g.setLineDash([14,12]);g.strokeStyle='#d6d3b5';g.lineWidth=2;for(const [x1,y1,x2,y2] of [[145,300,565,300],[145,140,565,140],[145,510,565,510],[620,185,620,465],[90,185,90,465]]){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}g.restore();for(let i=0;i<12;i++){const tx=155+i*53,ty=65;g.fillStyle='#405e38';g.beginPath();g.ellipse(tx+7,ty+5,13,8,0,0,7);g.fill();g.fillStyle='#315a39';g.beginPath();g.arc(tx,ty-5,12,0,7);g.fill()}rect(680,390,115,150,'#a6aaa3');for(let i=0;i<3;i++)rect(690+i*32,405,26,42,['#487a42','#b9a34e','#557a9c'][i]);label('BIR',700,475);label('Kvist-Kari',280,115);label('HEIM',45,240);const tx=stage===-1?107:stage===0?330:735,ty=stage===-1?300:stage===0?140:490;g.beginPath();g.arc(tx,ty,20,0,Math.PI*2);g.fillStyle='#f4ca55';g.fill();g.fillStyle='#222';g.font='bold 24px system-ui';g.fillText('!',tx-4,ty+8);
