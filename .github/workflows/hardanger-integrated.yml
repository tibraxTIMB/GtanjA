name: Hardanger integrated GIS
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hardanger-integrated.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyproj rasterio numpy
      - run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - run: pip install osmium
      - uses: actions/cache@v4
        with:
          path: hardanger.osm.pbf
          key: hardanger-osm-v1-${{ github.run_id }}
          restore-keys: hardanger-osm-v1-
      - name: Acquire local OSM extract
        run: |
          if [ ! -s hardanger.osm.pbf ]; then
            curl --fail --location --retry 3 --max-time 1200 https://download.geofabrik.de/europe/norway/vestlandet-latest.osm.pbf -o vestlandet.osm.pbf
            osmium extract -b 6.125,60.350,6.235,60.405 -s complete_ways vestlandet.osm.pbf -o hardanger.osm.pbf
            rm vestlandet.osm.pbf
          fi
          python reborn-x/tools/import_pbf.py hardanger.osm.pbf
      - uses: actions/upload-artifact@v4
        with:
          name: hardanger-vector-map
          path: reborn-x/data/hardanger.json
      - run: python reborn-x/tools/import_sandvenhagen.py hardanger.osm.pbf
        continue-on-error: true
      - run: python reborn-x/tools/project_sandvenhagen.py
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: sandvenhagen-detail
          path: reborn-x/data/sandvenhagen*
      - run: sudo apt-get update && sudo apt-get install -y gdal-bin
      - name: Terrain acquisition
        id: kartverket
        continue-on-error: true
        run: |
          python - <<'PY'
          from pyproj import Transformer
          import subprocess,re
          e,n=Transformer.from_crs(4326,25832,always_xy=True).transform(6.18,60.3775)
          url="WCS:https://wcs.geonorge.no/skwms1/wcs.hoyde-dtm-nhm-25832"
          info=subprocess.check_output(["gdalinfo",url],text=True)
          layers=re.findall(r"SUBDATASET_\d+_NAME=(.*)",info)
          if len(layers)!=1: raise RuntimeError("Ambiguous WCS coverage")
          r=3510
          subprocess.run(["gdal_translate","-projwin",str(e-r),str(n+r),str(e+r),str(n-r),"-tr","10","10",layers[0].strip(),"terrain.tif"],check=True)
          PY
      - name: Import Kartverket terrain
        id: national_dem
        if: steps.kartverket.outcome == 'success'
        continue-on-error: true
        run: python reborn-x/tools/import_terrain.py terrain.tif --license "Pending dataset license verification; test only" --source-url "https://wcs.geonorge.no/skwms1/wcs.hoyde-dtm-nhm-25832"
      - name: Copernicus GLO-30 fallback
        if: steps.national_dem.outcome != 'success'
        run: |
          tile=Copernicus_DSM_COG_10_N60_00_E006_00_DEM
          url="https://copernicus-dem-30m.s3.amazonaws.com/$tile/$tile.tif"
          curl --fail --location --retry 2 --max-time 180 "$url" -o copernicus.tif
          python reborn-x/tools/import_terrain.py copernicus.tif --step 20 --license "Copernicus DEM public licence; test only; verify attribution before distribution" --source-url "$url"
      - uses: actions/upload-artifact@v4
        with:
          name: hardanger-terrain
          path: |
            reborn-x/data/terrain.json
            reborn-x/data/terrain.f32
      - run: python reborn-x/tools/validate_geography.py
  preview:
    runs-on: ubuntu-latest
    needs: validate
    if: always()
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hardanger-vector-map
          path: reborn-x/data
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: hardanger-terrain
          path: reborn-x/data
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: sandvenhagen-detail
          path: reborn-x/data
      - run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path reborn-x --editor --import
          set -o pipefail
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path reborn-x --quit-after 300 2>&1 | tee runtime.log
          ! grep -E 'SCRIPT ERROR|ERROR:' runtime.log
      - uses: actions/upload-artifact@v4
        with:
          name: hardanger-preview-project
          path: reborn-x/
          include-hidden-files: false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gis-test-log
          path: runtime.log
  android:
    runs-on: ubuntu-latest
    needs: preview
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hardanger-vector-map
          path: reborn-x/data
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: hardanger-terrain
          path: reborn-x/data
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: sandvenhagen-detail
          path: reborn-x/data
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Godot and export templates
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable
          curl -fL --retry 3 "$base/Godot_v4.4.1-stable_linux.x86_64.zip" -o godot.zip
          unzip godot.zip
          sudo install Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 "$base/Godot_v4.4.1-stable_export_templates.tpz" -o templates.zip
          unzip -q templates.zip
          mkdir -p ~/.local/share/godot/export_templates
          mv templates ~/.local/share/godot/export_templates/4.4.1.stable
          mkdir -p ~/.config/godot ~/.android build
          test -f ~/.android/debug.keystore || keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          printf '[gd_resource type="EditorSettings" format=3]\n[resource]\nexport/android/java_sdk_path = "%s"\nexport/android/android_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\n' "$JAVA_HOME" "$ANDROID_HOME" "$HOME/.android/debug.keystore" > ~/.config/godot/editor_settings-4.4.tres
      - name: Validate and export
        run: |
          set -o pipefail
          godot --headless --path reborn-x --editor --import 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' import.log; then exit 1; fi
          godot --headless --path reborn-x --export-debug Android "$PWD/build/gtanja-debug.apk" 2>&1 | tee export.log
          test -s build/gtanja-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GTanjA-Hardanger-Android
          path: build/gtanja-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-logs
          path: '*.log'
