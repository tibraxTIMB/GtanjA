name: Hardanger drive Android
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hardanger-drive-android.yml'
permissions:
  contents: read
  actions: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 25c308c5f5366f377ac19e2e21ac96b13a623820
      - uses: actions/download-artifact@v4
        with:
          name: hardanger-vector-map
          run-id: 45501791253
          github-token: ${{ github.token }}
          path: reborn-x/data
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/platform-tools/adb"
      - name: Install Godot and export templates
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable
          curl -fL --retry 3 "$base/Godot_v4.4.1-stable_linux.x86_64.zip" -o godot.zip
          unzip godot.zip
          sudo install Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 "$base/Godot_v4.4.1-stable_export_templates.tpz" -o templates.zip
          unzip -q templates.zip
          mkdir -p ~/.local/share/godot/export_templates
          mv templates ~/.local/share/godot/export_templates/4.4.1.stable
          mkdir -p ~/.config/godot ~/.android build
          test -f ~/.android/debug.keystore || keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          printf '[gd_resource type="EditorSettings" format=3]\n[resource]\nexport/android/java_sdk_path = "%s"\nexport/android/android_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\n' "$JAVA_HOME" "$ANDROID_HOME" "$HOME/.android/debug.keystore" > ~/.config/godot/editor_settings-4.4.tres
      - name: Validate and export
        run: |
          set -o pipefail
          sed -i '/^rendering\/textures\/vram_compression\/import_etc2_astc=/d; /^textures\/vram_compression\/import_etc2_astc=/d; /^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' reborn-x/project.godot
          godot --headless --path reborn-x --editor --import 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' import.log; then exit 1; fi
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          godot --headless --verbose --path reborn-x --export-debug Android "$PWD/build/gtanja-debug.apk" 2>&1 | tee export.log
          test -s build/gtanja-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify build/gtanja-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GTanjA-Hardanger-Drive
          path: build/gtanja-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-logs
          path: '*.log'
